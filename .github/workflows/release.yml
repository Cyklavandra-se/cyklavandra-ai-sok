name: Bygg release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bygg zip
        run: |
          mkdir -p build/cyklavandra-ai-sok
          rsync -a --exclude '.git*' --exclude '.github' --exclude 'build' --exclude 'README.md' ./ build/cyklavandra-ai-sok/
          cd build && zip -r ../cyklavandra-ai-sok.zip cyklavandra-ai-sok

      - name: Skapa release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cyklavandra-ai-sok.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "Ladda ner cyklavandra-ai-sok.zip och ladda upp under Tillägg → Lägg till nytt → Ladda upp tillägg."
