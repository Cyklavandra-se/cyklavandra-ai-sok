name: Bygg release

# Två sätt att släppa en version:
#  1. Pusha en tagg vX.Y.Z  → releasen skapas automatiskt med zip och text från README.
#  2. Releases → Draft a new release → Publish  → zip bifogas till din release.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Kontrollera att taggen stämmer med versionen
        run: |
          VER=$(grep -m1 -E '^\s*\*\s*Version:' cyklavandra-ai-sok.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          CONST=$(grep -m1 "define( 'CVAI_VERSION'" cyklavandra-ai-sok.php | sed -E "s/.*'CVAI_VERSION', '([^']+)'.*/\1/")
          echo "Tagg: $TAG  Version: $VER  CVAI_VERSION: $CONST"
          if [ "${TAG#v}" != "$VER" ] || [ "$VER" != "$CONST" ]; then
            echo "::error::Taggen ($TAG) måste vara v + Version ($VER) och lika med CVAI_VERSION ($CONST)."
            exit 1
          fi

      - name: Bygg zip
        run: |
          mkdir -p build/cyklavandra-ai-sok
          rsync -a --exclude '.git*' --exclude '.github' --exclude 'build' --exclude 'README.md' --exclude 'CLAUDE.md' ./ build/cyklavandra-ai-sok/
          cd build && zip -r ../cyklavandra-ai-sok.zip cyklavandra-ai-sok

      - name: Skapa releasen om den saknas (vid taggpush)
        if: github.event_name == 'push'
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Releasen $TAG finns redan."
            exit 0
          fi
          # Releasetext = raden för versionen under "Versioner" i README.md.
          NOTES=$(grep -m1 -F -- "- **${TAG#v}** – " README.md | sed -E 's/^- \*\*[^*]+\*\* – //')
          [ -n "$NOTES" ] || NOTES="Version ${TAG#v}"
          gh release create "$TAG" --verify-tag --title "${TAG#v}" --notes "$NOTES" \
            || gh release view "$TAG" >/dev/null

      - name: Bifoga zip till releasen
        run: gh release upload "$TAG" cyklavandra-ai-sok.zip --clobber
