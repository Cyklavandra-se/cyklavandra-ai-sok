name: Bygg release

# Körs när du publicerar en release på GitHub (Releases → Draft a new release).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Kontrollera att taggen stämmer med versionen
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER=$(grep -m1 -E '^\s*\*\s*Version:' cyklavandra-ai-sok.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          CONST=$(grep -m1 "define( 'CVAI_VERSION'" cyklavandra-ai-sok.php | sed -E "s/.*'CVAI_VERSION', '([^']+)'.*/\1/")
          echo "Tagg: $TAG  Version: $VER  CVAI_VERSION: $CONST"
          if [ "${TAG#v}" != "$VER" ] || [ "$VER" != "$CONST" ]; then
            echo "::error::Taggen ($TAG) måste vara v + Version ($VER) och lika med CVAI_VERSION ($CONST)."
            exit 1
          fi

      - name: Bygg zip
        run: |
          mkdir -p build/cyklavandra-ai-sok
          rsync -a --exclude '.git*' --exclude '.github' --exclude 'build' --exclude 'README.md' ./ build/cyklavandra-ai-sok/
          cd build && zip -r ../cyklavandra-ai-sok.zip cyklavandra-ai-sok

      - name: Bifoga zip till releasen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" cyklavandra-ai-sok.zip --clobber
